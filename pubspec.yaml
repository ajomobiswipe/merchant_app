name: anet_merchants
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # state management
  flutter_bloc: ^9.1.1

  path_provider: ^2.1.5

  # routing
  go_router: ^17.5.0

  # networking
  dio: ^5.7.0
  logger: ^2.6.1
  retrofit: ^4.9.2

  # comparing objects
  equatable: ^2.0.5

  # service locator
  get_it: ^9.2.1

  # core
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  web: ^1.1.1

  # ui
  bloc: ^9.2.1
  shared_preferences: ^2.3.3
  pdf: ^3.12.0
  open_file: ^4.0.0
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

  retrofit_generator: ^10.2.6
  json_serializable: ^6.8.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300

  assets:
    - .env
    - assets/certificates/
    - assets/screen/

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#111016"
  image: assets/screen/anet_icon.png
  image_dark: assets/screen/anet_icon.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#111016"
    image: assets/screen/anet_icon.png
    image_dark: assets/screen/anet_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/screen/anet_icon.png
  image_path_ios: assets/screen/anet_launcher_icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_foreground: assets/screen/anet_icon.png
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21
