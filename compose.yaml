name: anet-merchants

services:
  web-prod:
    image: ${ANET_PROD_IMAGE:-anet-merchants-web:prod}
    ports:
      - "${ANET_PROD_PORT:-8000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-uat:
    image: ${ANET_UAT_IMAGE:-anet-merchants-web:uat}
    ports:
      - "${ANET_UAT_PORT:-8001}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
